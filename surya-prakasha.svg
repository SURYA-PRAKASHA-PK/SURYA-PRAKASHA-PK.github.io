<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img">
  <defs>
    <filter id="paper-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" />
      <feOffset dy="8" />
      <feComponentTransfer>
        <feFuncA type="linear" slope=".42" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <pattern id="gold-lines" width="8" height="8" patternTransform="rotate(35)" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#dcae42" />
      <path d="M0 0v8" stroke="#f3d276" stroke-width="2" opacity=".7" />
    </pattern>
    <pattern id="pink-dots" width="12" height="12" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" fill="#d65c69" />
      <circle cx="3" cy="3" r="1.5" fill="#f5b4a0" opacity=".8" />
    </pattern>
  </defs>

  <g fill="#d9e1be" font-family="Georgia, 'Times New Roman', serif" font-weight="bold">
    <text x="138" y="112" font-size="26" font-style="italic" transform="rotate(-5 138 112)">Hey, that's me</text>
  </g>

  <g fill="none" stroke="#d9e1be" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5">
    <path d="M208 129c3 47 40 77 75 103" />
    <path d="m267 226 17 8-5-18" />
  </g>

  <g fill="none" stroke="#e2c969" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" opacity=".9">
    <path d="m524 176-11-43 34 25 15-47 17 44 35-31-12 52-78 14z" />
    <circle cx="512" cy="131" r="4" fill="#e2c969" />
    <circle cx="562" cy="109" r="4" fill="#e2c969" />
    <circle cx="614" cy="121" r="4" fill="#e2c969" />
  </g>

  <g
    filter="url(#paper-shadow)"
    font-family="Georgia, 'Times New Roman', serif"
    font-weight="bold"
    paint-order="stroke fill"
    stroke="#f0e5c9"
    stroke-linejoin="round"
    stroke-width="2"
    text-anchor="middle"
  >
    <text x="600" y="330" font-size="198" letter-spacing="-9">
      <tspan fill="#db554d">S</tspan><tspan fill="url(#gold-lines)">U</tspan><tspan fill="#dfddd0">R</tspan><tspan fill="#477aa1">Y</tspan><tspan fill="#e58546">A</tspan>
    </text>
    <text x="600" y="458" font-size="107" letter-spacing="-3" textLength="790" lengthAdjust="spacingAndGlyphs">
      <tspan fill="#e8cf76">P</tspan><tspan fill="#e2854e">R</tspan><tspan fill="url(#pink-dots)">A</tspan><tspan fill="#d9ddd0">K</tspan><tspan fill="#668c72">A</tspan><tspan fill="#d4ab55">S</tspan><tspan fill="#d96867">H</tspan><tspan fill="#d9ddd0">A</tspan>
    </text>
  </g>

  <g fill="none" stroke="#d9e1be" stroke-linecap="round" stroke-width="2" opacity=".72">
    <path d="M360 502c52 13 98 18 144 15" stroke-dasharray="2 8" />
    <path d="M691 510c52-1 100-7 143-21" stroke-dasharray="2 8" />
  </g>
</svg>
